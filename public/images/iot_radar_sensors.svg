<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021a12"/>
      <stop offset="100%" stop-color="#083321"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#skyGrad)"/>

  <!-- River water -->
  <path d="M 0,420 Q 200,400 400,430 T 800,410 L 800,600 L 0,600 Z" fill="url(#riverGrad)" opacity="0.8"/>
  <path d="M 0,460 Q 250,440 500,470 T 800,450 L 800,600 L 0,600 Z" fill="#0284c7" opacity="0.6"/>

  <!-- Bridge Embankment -->
  <rect x="100" y="240" width="600" height="30" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="180" y="270" width="40" height="180" fill="#0f172a"/>
  <rect x="580" y="270" width="40" height="180" fill="#0f172a"/>

  <!-- Sensor Mast Tower -->
  <line x1="380" y1="240" x2="380" y2="70" stroke="#10b981" stroke-width="6"/>
  <line x1="360" y1="180" x2="400" y2="180" stroke="#10b981" stroke-width="3"/>
  <line x1="365" y1="120" x2="395" y2="120" stroke="#10b981" stroke-width="3"/>

  <!-- Solar Panel -->
  <polygon points="330,80 375,60 375,100 330,120" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
  <line x1="345" y1="73" x2="345" y2="113" stroke="#38bdf8" stroke-width="1"/>
  <line x1="360" y1="67" x2="360" y2="107" stroke="#38bdf8" stroke-width="1"/>

  <!-- OTT Radar Water Sensor Horn pointing downwards -->
  <path d="M 370,240 L 390,240 L 400,280 L 360,280 Z" fill="#f59e0b" stroke="#d97706" stroke-width="2"/>
  
  <!-- Radar Wave Beams down to water -->
  <path d="M 360,300 Q 380,310 400,300" fill="none" stroke="#34d399" stroke-width="2" stroke-dasharray="4,4"/>
  <path d="M 345,330 Q 380,345 415,330" fill="none" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,5"/>
  <path d="M 330,360 Q 380,380 430,360" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6,6"/>

  <!-- Industrial IP68 Enclosure Box -->
  <rect x="390" y="140" width="55" height="70" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
  <circle cx="418" cy="165" r="4" fill="#22c55e"/>
  <text x="400" y="195" fill="#ffffff" font-family="monospace" font-size="9" font-weight="bold">4G/LoRa</text>

  <!-- Rain Gauge Funnel on Side -->
  <path d="M 440,200 L 470,200 L 460,230 L 450,230 Z" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="450" y="230" width="10" height="20" fill="#64748b"/>

  <!-- Telemetry Badge -->
  <rect x="480" y="80" width="260" height="110" rx="12" fill="#022c22" stroke="#10b981" stroke-width="1.5" opacity="0.95"/>
  <text x="500" y="110" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold">RADAR TELEMETRY NODE #850</text>
  <text x="500" y="135" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">Accuracy: ±2.0 mm</text>
  <text x="500" y="158" fill="#94a3b8" font-family="sans-serif" font-size="12">Sampling: 10s Continuous</text>
  <text x="500" y="178" fill="#38bdf8" font-family="sans-serif" font-size="11">Modbus / SDI-12 / LTE-M</text>

  <!-- Bottom Title -->
  <text x="400" y="565" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Industrial River Telemetry & Radar Water Level Sensor Station</text>
</svg>
