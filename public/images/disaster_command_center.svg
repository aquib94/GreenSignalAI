<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140d"/>
      <stop offset="50%" stop-color="#062e1e"/>
      <stop offset="100%" stop-color="#03160e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f291e"/>
      <stop offset="100%" stop-color="#05170f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <circle cx="600" cy="280" r="450" fill="url(#glow)"/>

  <!-- Grid lines -->
  <g opacity="0.15" stroke="#10b981" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>

  <!-- Center Video Wall -->
  <rect x="250" y="60" width="700" height="340" rx="16" fill="url(#screenGrad)" stroke="#10b981" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="270" y="80" width="660" height="40" rx="8" fill="#02140d" opacity="0.8"/>
  <circle cx="295" cy="100" r="6" fill="#ef4444"/>
  <circle cx="315" cy="100" r="6" fill="#f59e0b"/>
  <circle cx="335" cy="100" r="6" fill="#10b981"/>
  <text x="360" y="105" fill="#a7f3d0" font-family="monospace" font-size="14" font-weight="bold">NATIONAL DISASTER OPERATIONS COMMAND • LIVE TELEMETRY</text>
  
  <!-- Video Wall Map Outline -->
  <path d="M 520,150 Q 560,170 580,210 T 620,290 T 570,360 T 480,310 T 450,220 Z" fill="#064e3b" stroke="#34d399" stroke-width="2" opacity="0.8"/>
  <circle cx="520" cy="200" r="7" fill="#10b981"><animate attributeName="r" values="5;9;5" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="270" r="7" fill="#38bdf8"><animate attributeName="r" values="5;9;5" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="490" cy="300" r="7" fill="#f59e0b"><animate attributeName="r" values="5;9;5" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="560" cy="330" r="7" fill="#ef4444"><animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/></circle>

  <!-- Left / Right Video Screens -->
  <rect x="60" y="100" width="160" height="260" rx="12" fill="url(#screenGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="80" y="130" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">SURGE TELEMETRY</text>
  <path d="M 80,220 Q 110,180 140,240 T 200,200" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <text x="80" y="270" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="bold">3.82 m</text>
  <text x="80" y="295" fill="#94a3b8" font-family="sans-serif" font-size="11">Surma Basin Level</text>

  <rect x="980" y="100" width="160" height="260" rx="12" fill="url(#screenGrad)" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <text x="1000" y="130" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">ACTIVE RELIEF</text>
  <rect x="1000" y="160" width="120" height="12" rx="6" fill="#064e3b"/>
  <rect x="1000" y="160" width="95" height="12" rx="6" fill="#10b981"/>
  <text x="1000" y="200" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="bold">78% Dispatched</text>
  <text x="1000" y="225" fill="#94a3b8" font-family="sans-serif" font-size="11">495 Upazila Hubs</text>

  <!-- Command Console Desk & Chairs -->
  <path d="M 150,540 L 1050,540 L 1150,675 L 50,675 Z" fill="#041f14" stroke="#065f46" stroke-width="2"/>
  <line x1="200" y1="580" x2="1000" y2="580" stroke="#10b981" stroke-width="1" opacity="0.3"/>

  <!-- Operator Desks / Monitors on Floor -->
  <rect x="350" y="460" width="120" height="70" rx="6" fill="#02140d" stroke="#10b981" stroke-width="1"/>
  <rect x="540" y="460" width="120" height="70" rx="6" fill="#02140d" stroke="#10b981" stroke-width="1"/>
  <rect x="730" y="460" width="120" height="70" rx="6" fill="#02140d" stroke="#10b981" stroke-width="1"/>

  <!-- Center Label Badge -->
  <rect x="380" y="605" width="440" height="46" rx="23" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="600" y="634" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">MoDMR 24/7 National Emergency Command Hub</text>
</svg>
