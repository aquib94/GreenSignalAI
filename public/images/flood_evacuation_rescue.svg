<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="floodBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021a24"/>
      <stop offset="100%" stop-color="#053040"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#floodBg)"/>

  <!-- Rain Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.3">
    <line x1="100" y1="50" x2="80" y2="180"/>
    <line x1="250" y1="30" x2="230" y2="160"/>
    <line x1="400" y1="70" x2="380" y2="200"/>
    <line x1="550" y1="40" x2="530" y2="170"/>
    <line x1="700" y1="80" x2="680" y2="210"/>
  </g>

  <!-- Flood Waters -->
  <path d="M 0,380 Q 200,350 400,380 T 800,360 L 800,600 L 0,600 Z" fill="#0369a1" opacity="0.9"/>
  <path d="M 0,420 Q 250,400 500,430 T 800,410 L 800,600 L 0,600 Z" fill="#0284c7" opacity="0.8"/>

  <!-- Rescue Inflatable Boat -->
  <g transform="translate(360, 390)">
    <path d="M -140,20 Q -100,50 0,50 Q 100,50 140,20 Q 160,0 120,0 L -120,0 Q -160,0 -140,20 Z" fill="#ea580c" stroke="#f97316" stroke-width="3"/>
    <text x="0" y="30" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">CPP / FIRE SERVICE RESCUE UNIT</text>
    
    <!-- Responders in Life Jackets -->
    <circle cx="-60" cy="-20" r="16" fill="#fbbf24"/>
    <rect x="-72" y="-4" width="24" height="20" rx="4" fill="#16a34a"/>

    <circle cx="0" cy="-25" r="16" fill="#fbbf24"/>
    <rect x="-12" y="-9" width="24" height="20" rx="4" fill="#16a34a"/>

    <circle cx="60" cy="-20" r="16" fill="#fbbf24"/>
    <rect x="48" y="-4" width="24" height="20" rx="4" fill="#16a34a"/>
  </g>

  <!-- High ground shelter with beacon -->
  <polygon points="620,260 720,210 790,260" fill="#047857"/>
  <rect x="630" y="260" width="140" height="90" fill="#064e3b"/>
  <circle cx="710" cy="200" r="10" fill="#22c55e"><animate attributeName="r" values="8;14;8" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="700" y="375" fill="#34d399" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Elevated Relief Shelter</text>

  <!-- Banner -->
  <rect x="150" y="40" width="500" height="44" rx="22" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
  <text x="400" y="68" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Grassroots Flood Evacuation & Cyclone Response</text>
</svg>
