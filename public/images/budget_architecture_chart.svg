  <text x="500" y="452" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="bold" text-anchor="middle">CapEx: BDT 73.50 Crore (73.5%) • OpEx (3 Years): BDT 26.50 Crore (26.5%) • Total: 100.00 Crore</text>
