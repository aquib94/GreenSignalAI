<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="satBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020d14"/>
      <stop offset="100%" stop-color="#072230"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#satBg)"/>

  <!-- Satellite Orbiting at Top -->
  <g transform="translate(600, 110)">
    <rect x="-30" y="-15" width="60" height="30" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <!-- Solar wings -->
    <rect x="-100" y="-12" width="60" height="24" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
    <rect x="40" y="-12" width="60" height="24" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="0" y="32" fill="#7dd3fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Bangabandhu Satellite-1</text>
  </g>

  <!-- Satellite Transmission Beam -->
  <path d="M 580,130 L 220,380" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>
  <path d="M 620,130 L 520,380" stroke="#10b981" stroke-width="2" stroke-dasharray="6,6" opacity="0.7"/>

  <!-- VSAT Ground Dish Station -->
  <g transform="translate(200, 420)">
    <path d="M -40,-30 A 50,50 0 0,1 40,-30" fill="none" stroke="#e2e8f0" stroke-width="6"/>
    <line x1="0" y1="-25" x2="0" y2="30" stroke="#64748b" stroke-width="6"/>
    <line x1="-30" y1="30" x2="30" y2="30" stroke="#64748b" stroke-width="6"/>
    <text x="0" y="60" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Coastal VSAT Dish (Char & Island Backup)</text>
  </g>

  <!-- Cellular Telemetry Tower -->
  <g transform="translate(520, 360)">
    <polygon points="0,-160 -40,90 40,90" fill="none" stroke="#10b981" stroke-width="4"/>
    <line x1="-15" y1="-100" x2="15" y2="-100" stroke="#10b981" stroke-width="3"/>
    <line x1="-25" y1="-40" x2="25" y2="-40" stroke="#10b981" stroke-width="3"/>
    <line x1="-35" y1="20" x2="35" y2="20" stroke="#10b981" stroke-width="3"/>
    <circle cx="0" cy="-160" r="10" fill="#ef4444"><animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
    <text x="0" y="120" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Private Telco APN & LoRaWAN (495 Hubs)</text>
  </g>

  <!-- Title Badge -->
  <rect x="150" y="30" width="500" height="44" rx="22" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="400" y="58" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Zero-Downtime Satellite & Multi-Telco Communications Grid</text>
</svg>
