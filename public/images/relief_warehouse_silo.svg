<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="whBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#042017"/>
      <stop offset="100%" stop-color="#0a3c2c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#whBg)"/>

  <!-- Ground / Elevated Plinth Base (2m Flood Proofing) -->
  <rect x="60" y="420" width="680" height="120" rx="8" fill="#1e293b" stroke="#047857" stroke-width="2"/>
  <text x="80" y="445" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">+2.0m REINFORCED CONCRETE FLOOD-PROOF PLINTH</text>

  <!-- Main Warehouse Building Structure -->
  <polygon points="120,220 380,140 640,220" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <rect x="120" y="220" width="520" height="200" fill="#0f2b20" stroke="#10b981" stroke-width="2"/>

  <!-- Rooftop Solar Array -->
  <polygon points="150,210 370,145 370,175 150,240" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <polygon points="390,145 610,210 610,240 390,175" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Warehouse Rolling Shutter Doors -->
  <rect x="160" y="270" width="120" height="150" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <line x1="160" y1="300" x2="280" y2="300" stroke="#475569" stroke-width="1"/>
  <line x1="160" y1="330" x2="280" y2="330" stroke="#475569" stroke-width="1"/>
  <line x1="160" y1="360" x2="280" y2="360" stroke="#475569" stroke-width="1"/>
  <line x1="160" y1="390" x2="280" y2="390" stroke="#475569" stroke-width="1"/>
  <text x="175" y="290" fill="#10b981" font-family="sans-serif" font-size="11" font-weight="bold">RELIEF BAY 01</text>

  <!-- Cold Chain Medical Unit Icon -->
  <rect x="320" y="270" width="120" height="150" fill="#082f49" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="380" cy="330" r="22" fill="#0369a1"/>
  <path d="M 374,320 L 386,320 M 380,314 L 380,326 M 372,336 L 388,336" stroke="#ffffff" stroke-width="3"/>
  <text x="330" y="290" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">WHO PQS COLD CHAIN</text>
  <text x="335" y="380" fill="#ffffff" font-family="monospace" font-size="12">2°C to 8°C</text>

  <!-- Hermetic Grain Silo on Right -->
  <rect x="480" y="230" width="120" height="190" rx="20" fill="#044e39" stroke="#34d399" stroke-width="2"/>
  <text x="495" y="260" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold">HERMETIC SILO</text>
  <text x="500" y="340" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">50 MT Grain</text>
  <text x="500" y="365" fill="#6ee7b7" font-family="sans-serif" font-size="11">Rice / Lentils</text>

  <!-- Badge banner -->
  <rect x="200" y="480" width="400" height="40" rx="20" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="400" y="505" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1,250 Climate-Hardened Union Buffer Silos</text>
</svg>
