<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#021f14"/>
      <stop offset="100%" stop-color="#06402b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#phoneBg)"/>

  <!-- Mobile Phone Frame -->
  <g transform="translate(400, 300)">
    <rect x="-140" y="-240" width="280" height="480" rx="36" fill="#090d16" stroke="#334155" stroke-width="6"/>
    <!-- Screen -->
    <rect x="-124" y="-210" width="248" height="420" rx="20" fill="#02140d"/>
    <!-- Dynamic Island / Speaker -->
    <rect x="-35" y="-200" width="70" height="12" rx="6" fill="#1e293b"/>
    
    <!-- App UI Header -->
    <rect x="-124" y="-180" width="248" height="45" fill="#065f46"/>
    <text x="-105" y="-152" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">GreenSignal Responder</text>
    <circle cx="100" cy="-156" r="5" fill="#22c55e"/>

    <!-- Offline Status Badge -->
    <rect x="-110" y="-120" width="220" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="0" y="-100" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">OFFLINE MODE • 24 PENDING SYNC</text>

    <!-- Relief QR Scan Card -->
    <rect x="-110" y="-75" width="220" height="90" rx="10" fill="#0f2b20" stroke="#047857" stroke-width="1"/>
    <text x="-95" y="-52" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Relief Ration Voucher</text>
    <text x="-95" y="-32" fill="#94a3b8" font-family="sans-serif" font-size="10">Family: 4 Persons • 25kg Rice</text>
    <!-- QR dummy -->
    <rect x="55" y="-62" width="40" height="40" fill="#ffffff"/>
    <rect x="62" y="-55" width="12" height="12" fill="#02140d"/>
    <rect x="77" y="-40" width="12" height="12" fill="#02140d"/>

    <!-- GPS Distress Route Button -->
    <rect x="-110" y="30" width="220" height="50" rx="12" fill="#dc2626"/>
    <text x="0" y="60" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EMERGENCY SOS DISTRESS</text>

    <!-- Bottom Nav -->
    <rect x="-124" y="170" width="248" height="40" fill="#042017"/>
    <circle cx="-70" cy="190" r="8" fill="#10b981"/>
    <circle cx="0" cy="190" r="8" fill="#475569"/>
    <circle cx="70" cy="190" r="8" fill="#475569"/>
  </g>

  <!-- Left Callout Box -->
  <g transform="translate(130, 200)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="-80" y="-30" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">FIELD WORKER PWA</text>
    <text x="-80" y="-5" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">2.5M+ Responders</text>
    <text x="-80" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">IndexedDB Offline Sync</text>
    <text x="-80" y="35" fill="#38bdf8" font-family="sans-serif" font-size="11">GPS Evacuation Routes</text>
  </g>

  <!-- Right Callout Box -->
  <g transform="translate(670, 200)">
    <rect x="-100" y="-60" width="200" height="120" rx="12" fill="#022c22" stroke="#10b981" stroke-width="1.5"/>
    <text x="-80" y="-30" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">QR BENEFICIARY ID</text>
    <text x="-80" y="-5" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Zero Leakage Delivery</text>
    <text x="-80" y="15" fill="#94a3b8" font-family="sans-serif" font-size="11">Duplicate Relief Block</text>
    <text x="-80" y="35" fill="#f59e0b" font-family="sans-serif" font-size="11">Real-Time Quota Audit</text>
  </g>
</svg>
